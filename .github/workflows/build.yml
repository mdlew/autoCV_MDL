# With some help from: https://gist.github.com/dgerosa/2e1f47a39180f39bde848e38243efa94

name: build

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.json"
      - "**/*.jsonc"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.md"
      - "LICENSE"

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: texlive/texlive:latest

    env:
      DIR: .
      FILE: cv

    steps:
      - name: Set up Git repository
        uses: actions/checkout@v7

      - name: Compile cv
        timeout-minutes: 15
        run: |
          latexmk \
            -pdflua \
            -interaction=nonstopmode \
            -halt-on-error \
            -output-directory="${{ env.DIR }}" \
            "${{ env.DIR }}/${{ env.FILE }}.tex"

      - name: Move pdf to dist folder
        run: |
          mkdir -p ${{ env.DIR }}/dist
          mv -v ${{ env.DIR }}/${{ env.FILE }}.pdf ${{ env.DIR }}/dist/

      - name: Add site files to artifact (e.g., /dist/, CNAME)
        run: |
          mkdir -p github_artifacts
          cp -v -R ${{ env.DIR }}/dist/* github_artifacts/
          # copy only if present (no failure if missing)
          for f in ${{ env.DIR }}/src/CNAME ${{ env.DIR }}/src/.nojekyll; do
            if [ -f "$f" ]; then
              cp -v "$f" github_artifacts/
            fi
          done

      - name: Upload pdf and site files for Github Pages
        id: deploy-GitHub
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./github_artifacts

      - name: Upload pdf and site files for Cloudflare Pages
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-artifact
          path: |
            ${{ env.DIR }}/dist/

  deploy-Cloudflare:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve pnpm version
        id: pnpm-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(npm view pnpm version)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ steps['pnpm-version'].outputs.version }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --force --fix-lockfile --no-frozen-lockfile

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: cloudflare-artifact
          path: ./dist

      - name: Generate types
        run: pnpm run generate-types

      - name: Build
        run: pnpm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            ~/**/pnpm-lock.yaml
            ~/**/worker-configuration.d.ts

  deploy-GitHub:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Deploy to the github-pages environment
    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
